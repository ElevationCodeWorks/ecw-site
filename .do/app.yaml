alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
domains:
- domain: elevationcode.works
  type: PRIMARY
  zone: elevationcode.works
features:
- buildpack-stack=ubuntu-22
ingress:
  rules:
  # The app's ondigitalocean.app address redirects to the production
  # hostname, so only elevationcode.works is indexed (seo spec, "One public
  # hostname").
  - match:
      authority:
        exact: ${STARTER_DOMAIN}
    redirect:
      authority: elevationcode.works
      scheme: https
      redirect_code: 301
  # The previous site's About page (seo spec, "Legacy URLs redirect
  # permanently").
  - match:
      path:
        prefix: /about.html
    redirect:
      uri: /about/
      redirect_code: 301
  - component:
      name: ecw-site
    match:
      path:
        prefix: /
name: king-prawn-app
region: nyc
static_sites:
- build_command: npm run build
  environment_slug: node-js
  envs:
  # Makes this build indexable (src/lib/env.ts).
  - key: SITE_ENV
    scope: BUILD_TIME
    type: GENERAL
    value: production
  # The site check's private employer terms. The value is never committed:
  # enter it in the App Spec editor before saving. Left empty, the build
  # fails at the site check and nothing deploys.
  - key: SITE_CHECK_PRIVATE_TERMS
    scope: BUILD_TIME
    type: SECRET
    value: ""
  error_document: 404.html
  github:
    branch: main
    deploy_on_push: true
    repo: ElevationCodeWorks/ecw-site
  name: ecw-site
  output_dir: dist
  source_dir: /
