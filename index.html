<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elevation Code Works</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background-color: #121212;
        font-family: "Inter", sans-serif;
        color: #ffffff;
        position: relative;
        overflow: hidden;
      }

      /* Background pattern overlay */
      body::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background:
          linear-gradient(
            135deg,
            rgba(18, 18, 18, 0.9) 0%,
            rgba(26, 26, 26, 0.9) 50%,
            rgba(36, 36, 36, 0.9) 100%
          ),
          repeating-linear-gradient(
            45deg,
            rgba(255, 255, 255, 0.1) 0px,
            rgba(255, 255, 255, 0.1) 2px,
            transparent 2px,
            transparent 40px
          ),
          repeating-linear-gradient(
            -45deg,
            rgba(255, 255, 255, 0.1) 0px,
            rgba(255, 255, 255, 0.1) 2px,
            transparent 2px,
            transparent 40px
          ),
          linear-gradient(
              45deg,
              transparent 0%,
              transparent 49%,
              rgba(255, 255, 255, 0.1) 49%,
              rgba(255, 255, 255, 0.1) 51%,
              transparent 51%,
              transparent 100%
            )
            0 0 / 60px 60px,
          radial-gradient(
              circle at center,
              rgba(255, 255, 255, 0.15) 0,
              rgba(255, 255, 255, 0.15) 2px,
              transparent 2px
            )
            0 0 / 30px 30px;
        z-index: -1;
      }

      /* Animated gradient overlay */
      body::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: radial-gradient(
          circle at 50% 50%,
          rgba(18, 18, 18, 0) 0%,
          rgba(18, 18, 18, 0.4) 50%,
          rgba(18, 18, 18, 0.7) 100%
        );
        z-index: -1;
        animation: pulse 8s ease-in-out infinite;
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.2);
        }
        100% {
          transform: scale(1);
        }
      }

      .container {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        position: relative;
        z-index: 1;
        background: radial-gradient(
          circle at center,
          rgba(18, 18, 18, 0) 0%,
          rgba(18, 18, 18, 0.5) 100%
        );
      }

      h1 {
        font-size: clamp(2rem, 6vw, 4rem);
        font-weight: 600;
        text-align: center;
        margin-bottom: 1rem;
        background: linear-gradient(45deg, #ffffff 0%, #f0f0f0 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
      }

      .typing-text {
        font-size: clamp(1rem, 3vw, 1.5rem);
        font-weight: 300;
        text-align: center;
        color: #a0a0a0;
        text-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        position: relative;
        width: max-content;
        margin: 0 auto;
        font-family: "JetBrains Mono", monospace;
        padding-right: 0.3em; /* Space for cursor */
      }

      .typing-text::before,
      .typing-text::after {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
      }

      .typing-text::before {
        background: #121212;
        animation: typewriter 3s steps(31) 1s forwards;
      }

      .typing-text::after {
        width: 0.3em; /* Wider cursor */
        background: #a0a0a0;
        animation:
          typewriter 3s steps(31) 1s forwards,
          blink 750ms steps(2, start) infinite;
        border-radius: 2px; /* Slightly rounded corners */
      }

      @keyframes typewriter {
        to {
          left: 100%;
        }
      }

      @keyframes blink {
        to {
          background: transparent;
        }
      }

      @media (max-width: 768px) {
        .container {
          padding: 15px;
        }
      }

      .cta-button {
        display: inline-block;
        margin-top: 2rem;
        padding: 0.8em 1.6em;
        font-family: "Inter", sans-serif;
        font-size: 1.1rem;
        font-weight: 500;
        text-decoration: none;
        color: #ffffff;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.1) 0%,
          rgba(255, 255, 255, 0.05) 100%
        );
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        backdrop-filter: blur(10px);
        transition: all 0.3s ease;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      }

      .cta-button:hover {
        transform: translateY(-2px);
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.15) 0%,
          rgba(255, 255, 255, 0.1) 100%
        );
        box-shadow: 0 6px 25px rgba(0, 0, 0, 0.3);
      }

      .cta-button:active {
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Elevation Code Works</h1>
      <div class="typing-text">A software engineering company</div>
      <a href="about.html" class="cta-button">About Us</a>
    </div>
  </body>
</html>
